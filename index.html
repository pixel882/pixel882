<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        img {
            border: 3px solid black;
        }
    </style>
</head>

<body>
    <div id="app">
        <div :style="{ fontSize: fontSize + 'px',  color: color, background: bg }">element</div>
        <p>Zmień wielkość napisu:</p>
        <input type="range" v-model="fontSize" min="20" max="100">
        <p>Zmień kolor tła napisu</p>
        <input type="color" v-model="bg">
        <p>Zmień kolor napisu</p>
        <input type="color" v-model="color">
    </div>
    <script>
        const app = Vue.createApp({

            data() {
                return {
                    fontSize: 20,
                    bg: "white",
                    color: "black"
                }
            }
        }).mount("#app")
    </script>
</body>

</html>
